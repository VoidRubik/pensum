<!doctype html>
<html>
<head><meta charset="utf-8"><title>hidden-tab spike</title></head>
<body>
<video id="v" autoplay playsinline muted style="width:320px"></video>
<canvas id="c" width="320" height="180"></canvas>
<script>
window.spikeResult = { started: false, done: false, error: null, hidden: null, nonBlank: null, usedFallback: null, visLog: [] };
document.addEventListener('visibilitychange', () => {
  window.spikeResult.visLog.push({ t: Date.now(), state: document.visibilityState });
});
window.spikeResult.visLog.push({ t: Date.now(), state: document.visibilityState, initial: true });

async function run() {
  window.spikeResult.started = true;
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const track = stream.getVideoTracks()[0];
    const video = document.getElementById('v');
    video.srcObject = stream;
    await video.play().catch(() => {});
    // give the fake capture source a moment to produce frames, and give
    // the caller time to minimize the window before we read visibility state
    await new Promise(r => setTimeout(r, 2500));

    window.spikeResult.hidden = document.hidden;
    window.spikeResult.visibilityState = document.visibilityState;

    let bitmap;
    let usedFallback = false;
    if ('ImageCapture' in window) {
      try {
        const capture = new ImageCapture(track);
        bitmap = await capture.grabFrame();
      } catch (e) {
        usedFallback = true;
      }
    } else {
      usedFallback = true;
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    if (bitmap && !usedFallback) {
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      ctx.drawImage(bitmap, 0, 0);
    } else {
      // video->canvas fallback
      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 180;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    }
    window.spikeResult.usedFallback = usedFallback;

    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let nonZero = 0;
    for (let i = 0; i < data.length; i += 40) {
      if (data[i] !== 0) nonZero++;
    }
    window.spikeResult.nonBlank = nonZero > 0;
    window.spikeResult.done = true;
  } catch (e) {
    window.spikeResult.error = String(e && e.message || e);
    window.spikeResult.done = true;
  }
}
run();
</script>
</body>
</html>
